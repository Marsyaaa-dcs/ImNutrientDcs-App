<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>BMI & Calorie Calculator</title>
    <link rel="stylesheet" href="css/bmi.css">
</head>

<body>
    <h1><b><i>GET KNOW YOURSELF!</i></b></h1><br>

    <h3> BMI TRACKER</h3><br>
    <!-- input for name-->
    <label for="name">Name:</label>
    <input type="text" id="name" step="any"><br><br>


    <!-- input for age-->
    <label for="age">Age:</label>
    <input type="number" id="age" step="any"><br><br>

    <!-- gender of user-->
    <label for="gender">Gender:</label>
    <select id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select><br><br>

    <!-- weight of user-->
    <label for="weight">Weight (kg):</label>
    <input type="number" id="weight" step="any"><br><br>

    <!-- height of user-->
    <label for="height">Height (cm):</label>
    <input type="number" id="height" step="any"><br><br>

    <!-- how activete is user-->
    <label for="activity">Activity Level:</label>
    <select id="activity">
        <option value="1.2">Sedentary (little or no exercise)</option>
        <option value="1.375">Light (1-3 days/week)</option>
        <option value="1.55">Moderate (3-5 days/week)</option>
        <option value="1.725">Active (6-7 days/week)</option>
    </select><br><br>

    <button id="calcBtn">Calculate</button>
    <div id="result" class="result-card" style="display:none;">
    </div>

    <footer>
        <p>&copy; 2026 ImNutrientDcs App. All rights reserved.</p>
    </footer>

    <!-- call javascript-->
    <script src="js/bmi.js"></script>

</body>
</html>
